services:
  - type: web
    name: parcelcare-team8
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PARCELCARE_API_URL
        fromService:
          type: web
          name: parcelcare-team8-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromService:
          type: web
          name: parcelcare-team8-api
          envVarKey: SUPABASE_URL
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        fromService:
          type: web
          name: parcelcare-team8-api
          envVarKey: SUPABASE_PUBLIC_KEY
  - type: web
    name: parcelcare-team8-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLIC_KEY
        sync: false
