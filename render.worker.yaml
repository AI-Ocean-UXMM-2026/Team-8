# Optional, separately deployed worker. Applying this creates a billable service;
# do not sync it just to run local tests. The main web Blueprint stays unchanged.
services:
  - type: worker
    name: parcelcare-team8-ai-worker
    runtime: python
    rootDir: api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_WORKER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_CHECKER_MODEL
        value: gpt-5.4
